<ul class="links">
  {% if site.links.github != "" %}<li><a href="{{ site.links.github }}">GitHub</a></li>{% endif %}
  {% if site.links.linkedin != "" %}<li><a href="{{ site.links.linkedin }}">LinkedIn</a></li>{% endif %}
  {% if site.links.itch != "" %}<li><a href="{{ site.links.itch }}">itch.io</a></li>{% endif %}
  {% if site.links.discord != "" %}<li>Discord: {{ site.links.discord }}</li>{% endif %}
</ul>

---
layout: default
---
{% assign parent = site.projects | where: "slug", page.project | first %}
<article class="post">
  <p class="back">
    {% if parent %}<a href="{{ parent.url | relative_url }}">Back to {{ parent.title }}</a>
    {% else %}<a href="{{ '/' | relative_url }}">Back to home</a>{% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  <p class="small"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  <div class="prose">
    {{ content }}
  </div>
</article>
